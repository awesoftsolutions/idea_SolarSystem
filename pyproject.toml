[tool.poetry]
name = "solar"
version = "0.1.0"
description = "Deterministic 2D solar system simulation"
authors = ["Favur Platform"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pygame = "^2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
